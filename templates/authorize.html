<!DOCTYPE html>
<html>
<head>
    <title>Authorize</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h2>Authorize Application</h2>
        <p>The application is requesting access to your account.</p>

        <!-- Display error message if any -->
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <!-- Login Form -->
        <div class="form-container">
            <h3>Login</h3>
            <form action="/authorize" method="post">
                <input type="hidden" name="client_id" value="{{ client_id }}">
                <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
                <input type="hidden" name="scope" value="{{ scope }}">
                <input type="hidden" name="state" value="{{ state }}">
                <input type="hidden" name="action" value="login">
                <label for="login_email">Email:</label>
                <input type="email" id="login_email" name="email" required><br><br>
                <label for="login_password">Password:</label>
                <input type="password" id="login_password" name="password" required><br><br>
                <button type="submit">Login</button>
            </form>
        </div>

        <hr>

        <!-- Registration Form -->
        <div class="form-container">
            <h3>Register</h3>
            <form action="/authorize" method="post">
                <input type="hidden" name="client_id" value="{{ client_id }}">
                <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
                <input type="hidden" name="scope" value="{{ scope }}">
                <input type="hidden" name="state" value="{{ state }}">
                <input type="hidden" name="action" value="register">
                <label for="register_name">Name:</label>
                <input type="text" id="register_name" name="name" required><br><br>
                <label for="register_email">Email:</label>
                <input type="email" id="register_email" name="email" required><br><br>
                <label for="register_password">Password:</label>
                <input type="password" id="register_password" name="password" required><br><br>
                <button type="submit">Register</button>
            </form>
        </div>

    </div>
</body>
</html>
